name: Deploy

on:
  push:
    branches: [ v2 ]

jobs:
    build-deploy:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v6
        - name: Install Bun
          run: |
            curl -fsSL https://bun.sh/install | bash
            echo "$HOME/.bun/bin" >> $GITHUB_PATH
        - name: Check Bun
          run: bun --version
        - run: bun install
        - run: bun run build
        - name: setup ssh
          run: |
            mkdir -p ~/.ssh
            chmod 0700 ~/.ssh
            echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
            chmod 0600 ~/.ssh/id_ed25519
            ssh-keyscan -H ${{ vars.SSH_HOST }} >> ~/.ssh/known_hosts
        - name: Deploy via SSH
          run: scp -r dist/* ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}:/srv/oriondev.fr/
