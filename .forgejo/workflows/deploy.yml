name: Deploy

on:
  push:
    branches: [ v2 ]

jobs:
    build-deploy:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v6
        - name: Install Bun
          run: |
            curl -fsSL https://bun.sh/install | bash
            echo "$HOME/.bun/bin" >> $GITHUB_PATH
        - name: Check Bun
          run: bun --version
        - run: bun install
        - run: bun run build
        - name: setup ssh
          run: |
            mkdir -p ~/.ssh
            chmod 0700 ~/.ssh
            echo "${{ secrets.DEPLOY_KEY }}" > ~/.ssh/id_ed25519
            chmod 0600 ~/.ssh/id_ed25519
            echo "${{ vars.SSH_HOST }} ${{ vars.SSH_PUB_KEY }}" >> ~/.ssh/known_hosts
            chmod 0600 ~/.ssh/known_hosts
        - name: Deploy via SSH
          run: |
            mkdir -p ~/tmp_deploy
            scp -i ~/.ssh/id_ed25519 -r dist/* ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}:~/tmp_deploy/
            ssh -i ~/.ssh/id_ed25519 ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }} \
              "sudo cp -r ~/tmp_deploy/* /srv/oriondev.fr/"
