name: Deploy

on:
  push:
    branches: [ v2 ]

jobs:
    build-deploy:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v6
        - name: Install Bun
          run: |
            curl -fsSL https://bun.sh/install | bash
            echo "$HOME/.bun/bin" >> $GITHUB_PATH
        - name: Check Bun
          run: bun --version
        - run: bun install
        - run: bun run build
        - name: Deploy via SSH
          run: |
            mkdir -p ~/tmp_deploy
            scp -i ${{ secrets.DEPLOY_KEY }} -r dist/* ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/tmp_deploy/
            ssh -i ${{ secrets.DEPLOY_KEY }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
              "sudo cp -r ~/tmp_deploy/* /srv/oriondev.fr/"
