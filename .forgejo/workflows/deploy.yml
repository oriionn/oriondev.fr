name: Deploy

on:
  push:
    branches: [ v2 ]
  workflow_dispatch:

jobs:
    build-deploy:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v6
        - name: Install Bun
          run: |
            curl -fsSL https://bun.sh/install | bash
            echo "$HOME/.bun/bin" >> $GITHUB_PATH
        - name: Check Bun
          run: bun --version
        - name: Install Dependencies
          run: bun install
        - name: Build Website
          run: bun run build
        - name: Install SSH key
          uses: https://github.com/shimataro/ssh-key-action@v2
          with:
            key: ${{ secrets.DEPLOY_KEY }}
            name: id_ed25519
            known_hosts: ${{ secrets.KNOWN_HOSTS }}
            if_key_exists: replace
        - name: Install rSync
          run: |
              sudo apt-get update
              sudo apt-get install -y rsync
        - name: Deploy via SSH
          run: rsync -e "ssh -i ~/.ssh/id_ed25519" -az dist/* ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}:/
